name: Verify mobile gameplay
on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/*.test.mjs'
      - 'index.html'
      - 'sw.js'
      - 'navigation-map.css'
      - 'development-ui.css'
      - 'gm-controls.css'
      - 'naval-combat.css'
      - 'rpg-hud.css'
      - 'arena.css'
      - 'desktop-hud.css'
      - 'assets/arena/**'
      - 'assets/boats/**'
      - 'assets/pets/**'
      - 'assets/monsters/**'
      - 'assets/garner/**'
      - 'tests/marine-editor.*'
      - 'scripts/build_garner_stream.py'
      - 'scripts/build_mobile_boat.py'
      - 'scripts/build_default_pet.py'
      - 'scripts/build_arena_map.py'
      - 'scripts/build_garner_monsters.py'
      - 'scripts/verify_mobile_assets.py'
      - 'tools/lmo_dump.cpp'
      - '.github/workflows/mobile-gameplay.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mobile gameplay and published boat assets
        run: node --test tests/*.test.mjs
      - name: Check navigation syntax
        run: node --check js/main.js && node --check js/sea-navigation.mjs && node --check js/navigation-map.mjs && node --check js/navigation-markers.mjs && node --check js/marine-visuals.mjs && node --check js/streamed-world.mjs && node --check js/marine-design.mjs && node --check js/boat-camera.mjs && node --check js/performance-monitor.mjs && node --check js/render-budget.mjs && node --check js/fountain.js && node --check tests/marine-editor.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check boat exporter syntax
        run: python -m py_compile scripts/build_mobile_boat.py scripts/build_garner_stream.py scripts/build_default_pet.py scripts/build_arena_map.py scripts/build_garner_monsters.py
      - name: Verify original monster assets
        run: python scripts/verify_mobile_assets.py
      - name: Check combat and pet syntax
        run: node --check js/combat-state.mjs && node --check js/monster-motion.mjs && node --check js/monster-manager.mjs && node --check js/monster-population.mjs && node --check js/gm-controls.mjs && node --check js/pet-manager.mjs && node --check js/pet-motion.mjs
      - name: Check naval progression and refinement syntax
        run: node --check js/boat-state.mjs && node --check js/naval-combat.mjs && node --check js/naval-effects.mjs && node --check js/refinement-rules.mjs && node --check js/refinement-effects.mjs
      - name: Check camera and inventory UI syntax
        run: node --check js/camera-distance.mjs && node --check js/inventory-view.mjs && node --check js/rpg-hud.mjs && node --check js/desktop-hud.mjs
      - name: Check tower syntax
        run: node --check js/arena-state.mjs && node --check js/arena-world.mjs && node --check js/arena-ui.mjs
