name: Verify historical pose export
on:
  pull_request:
    paths:
      - 'scripts/build_evanescence.py'
      - 'scripts/verify_pose_glb.py'
      - 'tests/test_pose_export.py'
      - 'assets/poses/historical-catalog.json'
      - 'assets/equipment/manifest.json'
      - 'Lance/converter.py'
      - 'js/main.js'
      - 'js/pose-studio-runtime.mjs'
      - 'tests/pose-editor.mjs'
      - 'tests/pose-editor.html'
      - 'tests/pose-studio.test.mjs'
      - 'tests/pose-missing-report.test.mjs'
      - 'tests/pose-action-catalog.test.mjs'
      - 'index.html'
      - '.github/workflows/verify-poses.yml'
  workflow_dispatch:

jobs:
  pose-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check converter syntax
        run: python -m py_compile scripts/build_evanescence.py scripts/verify_pose_glb.py Lance/converter.py
      - name: Run pose export regression tests
        run: python -m unittest discover -s tests -p 'test_pose_export.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pose Studio and historical action tests
        run: node --test tests/pose-studio.test.mjs tests/pose-action-catalog.test.mjs tests/pose-missing-report.test.mjs
      - name: Check JS syntax
        run: node --check js/main.js && node --check js/pose-studio-runtime.mjs && node --check tests/pose-editor.mjs
