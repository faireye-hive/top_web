name: Verify historical pose export
on:
  pull_request:
    paths:
      - 'scripts/build_evanescence.py'
      - 'scripts/verify_pose_glb.py'
      - 'tests/test_pose_export.py'
      - 'assets/poses/historical-catalog.json'
      - 'assets/equipment/manifest.json'
      - '.github/workflows/verify-poses.yml'
  workflow_dispatch:

jobs:
  pose-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check converter syntax
        run: python -m py_compile scripts/build_evanescence.py scripts/verify_pose_glb.py
      - name: Run pose export regression tests
        run: python -m unittest discover -s tests -p 'test_pose_export.py' -v
